<section class="tab-section">

	<h4 class="tab-section-title">
		{{ title }}
	</h4>

	<ul class="dependencies-list">

{% for dependency in dependencies %}

		<li class="dependency">
			<span class="dependency-name">
				{{ dependency.name }}
			</span>
			<span class="dependency-license">
				{{ dependency.license }}
            </span>

			{{ dependency.link }}

		</li>

{% endfor %}

	</ul>

</section>
