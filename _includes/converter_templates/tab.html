<div	class="tab-content-wrapper"
		id="tab-{{ tab_id }}">


	<div class="tab-header">

		<h3 class="tab-title">
			{{ tab_title }}
		</h3>

{% if tab_desc %}
	{% for item in tab_desc %}

		<p class="tab-description">
			{{ item }}
		</p>

	{% endfor %}
{% endif %}

	</div>


{% if tab_sections %}
	{% for section in tab_sections %}

	{{ section }}

	{% endfor %}
{% endif %}


</div>
